[package]
name = "ws-relay"
version = "0.2.0"
edition = "2024"
description = "Low-footprint WebSocket fan-out relay"
license-file = "LICENSE"

[features]
default = ["metrics"]
# Counters plus a tiny HTTP endpoint (/health, /metrics, /stats.json, /).
# Build with --no-default-features for the smallest possible binary.
metrics = []

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "macros", "signal", "time", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
